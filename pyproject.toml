[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-notification-assistant"
version = "0.1.0"
description = "Investigation and drafting assistant for Nevada Gaming Commission Regulation 5.260 cyber incident notifications."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Robert L. Bogan Jr." }]
requires-python = ">=3.11"
dependencies = [
  "itops-mcp-gateway @ git+https://github.com/sdballpark/itops-mcp-gateway@v1.2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
incident-assistant = "incident_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_assistant = ["data/**/*.json", "data/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
