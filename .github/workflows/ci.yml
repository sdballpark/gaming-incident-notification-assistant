name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # CI runners have no GPU, so the agent here is the scripted reference
    # investigation. It drives every control through the gateway exactly as a model
    # would. Model runs happen locally and are reported in the README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Corpus rebuilds identically from the official text
        run: |
          python scripts/build_corpus.py \
            src/incident_assistant/data/corpus/regulation-5.260-adopted-2026-01-29.source.txt \
            6ace105ef55e56c5d8c3f88149ca5275b31a9d7c12619d502df2a390cccf8ab0
          git diff --exit-code src/incident_assistant/data/corpus/
      - name: Test suite
        run: python -m pytest -q
      - name: End to end, clean and injected twin
        run: |
          incident-assistant run --scenario s01-helpdesk-reset --decide-by m.okafor --approve-by d.lee
          incident-assistant run --scenario s01-helpdesk-reset-injected
